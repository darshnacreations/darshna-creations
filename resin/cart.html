<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart - Darshna Creations</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff8fb;
  color: #4a2c35;
}

header {
  background: #fde1ea;
  text-align: center;
  padding: 30px 20px;
  border-bottom: 1px solid #f2bfd2;
}

header h1 {
  margin: 0;
  color: #b04a72;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.cart-box {
  background: white;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

.cart-item {
  padding: 10px 0;
}

button {
  border: none;
  border-radius: 20px;
  padding: 10px 18px;
  margin: 5px;
  cursor: pointer;
}

.order {
  background: #25D366;
  color: white;
  font-size: 17px;
  padding: 14px 25px;
  width: 100%;
}

.back {
  display: inline-block;
  margin-top: 20px;
  color: #b04a72;
  text-decoration: none;
  font-weight: bold;
}

.total {
  font-size: 20px;
  font-weight: bold;
  color: #b04a72;
  margin-top: 20px;
}

</style>

</head>

<body>

<header>

<h1>🛒 Your Cart</h1>

<p>Darshna Creations</p>

</header>


<div class="container">

<div class="cart-box">

<div id="cart-items"></div>

<div class="total">
Total: <span id="cart-total">₹0</span>
</div>

<br>

<button class="order" onclick="orderOnWhatsApp()">
💬 Order All on WhatsApp
</button>

</div>


<center>

<a class="back" href="resin.html">
← Continue Shopping
</a>

</center>

</div>


<script src="../cart.js"></script>

<script>
displayCart();
updateCartCount();
</script>

</body>

</html>
